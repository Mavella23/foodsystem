<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Makes the page responsive on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Food System{% endblock %}</title>

    <!-- Load Django's static file system -->
    {% load static %}

    <!-- Link all your CSS files -->
   <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

    <!-- NAVBAR: shows on every page -->
    <nav class="navbar">
        <div class="navbar-brand"> FoodSystem</div>
        <ul class="navbar-links">
            {% if request.user.is_authenticated %}
                <!-- Show username and logout when logged in -->
                <li><span class="navbar-user">Hi, {{ request.user.username }}</span></li>
                <li><a href="{% url 'logout' %}" class="btn btn-outline">Logout</a></li>
            {% else %}
                <!-- Show login/register when not logged in -->
                <li><a href="{% url 'login' %}">Login</a></li>
                <li><a href="{% url 'register' %}" class="btn btn-primary">Register</a></li>
            {% endif %}
        </ul>
    </nav>

    <!-- MESSAGES: Django flash messages (errors, success, etc.) -->
    {% if messages %}
        <div class="messages-container">
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <!-- MAIN CONTENT: each page fills this block -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
