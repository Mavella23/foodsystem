<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f5f5f5; }
        .navbar { background: #2c3e50; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .navbar h2 { margin: 0; }
        .navbar a { color: white; text-decoration: none; background: rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 4px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .welcome { background: white; padding: 25px; border-radius: 8px; margin-bottom: 25px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .card { background: white; padding: 25px; border-radius: 8px; text-align: center; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
        .card h3 { margin: 0 0 8px; color: #2c3e50; font-size: 2em; }
        .card p { margin: 0; color: #666; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #2c3e50; color: white; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
    <div class="navbar">
        <h2>⚙️ FoodSystem — Admin</h2>
        <span>Hello, {{ request.user.username }} | <a href="/admin/">Django Admin</a> | <a href="{% url 'logout' %}">Logout</a></span>
    </div>
    <div class="container">
        <div class="welcome">
            <h2>Admin Control Panel</h2>
            <p>Manage users, vendors, orders, and system settings.</p>
        </div>
        <div class="cards">
            <div class="card">
                <h3>👥</h3>
                <p>Users</p>
                <a href="/admin/users/user/" class="btn">Manage</a>
            </div>
            <div class="card">
                <h3>🍽️</h3>
                <p>Vendors</p>
                <a href="#" class="btn">Manage</a>
            </div>
            <div class="card">
                <h3>📋</h3>
                <p>All Orders</p>
                <a href="#" class="btn">View</a>
            </div>
            <div class="card">
                <h3>📊</h3>
                <p>Reports</p>
                <a href="#" class="btn">View</a>
            </div>
        </div>
    </div>
</body>
</html>
